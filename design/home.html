<!doctype html>
<html lang="zh-Hant" data-theme="light" data-accent="green">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Unfold · 首頁</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600&family=Noto+Sans+TC:wght@400;500;600&family=JetBrains+Mono:wght@400;500&family=LXGW+WenKai+TC:wght@400;700&display=swap">
<link rel="stylesheet" href="unfold.css">
<style>
.home { display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 0 40px 40px; overflow: hidden; }
.col { width: 100%; max-width: 680px; }
.art { display: block; margin: 0 auto 26px; color: var(--fg); }
.art .f { fill: var(--raise); stroke: currentColor; stroke-width: 1.4; stroke-linejoin: round; }
.art .f2 { fill: var(--sub); }
.art .acc { fill: var(--acc); }
.art .ln2 { stroke: var(--fg-3); stroke-width: 1.2; stroke-linecap: round; }
h1 { text-align: center; font-size: 36px; font-weight: 500; letter-spacing: -.03em; line-height: 1.25; }
.lead { text-align: center; color: var(--fg-3); margin-top: 8px; font-size: 15px; }
.ask { margin-top: 28px; }
.ask .box { min-height: 64px; padding: 12px 12px 12px 22px; font-size: 15.5px; }
.ask .send { width: 40px; height: 40px; border-radius: 13px; }
.under { display: flex; align-items: center; gap: 8px; margin-top: 12px; padding: 0 6px; color: var(--fg-3); font-size: 12.5px; }
.chip { display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--line); border-radius: 999px; padding: 3px 10px; color: var(--fg-2); }
.chip i { width: 6px; height: 6px; border-radius: 50%; background: var(--acc); }
.under .sp { flex: 1; }
.try { display: flex; align-items: center; justify-content: center; gap: 8px; margin-top: 30px; flex-wrap: wrap; }
.try .lbl { font-size: 12.5px; color: var(--fg-3); margin-right: 4px; }
.cont { margin-top: 36px; border-top: 1px solid var(--line); padding-top: 14px; }
.cont h2 { font-size: 12.5px; font-weight: 500; color: var(--fg-3); padding: 0 10px 6px; }
.rowl { display: grid; grid-template-columns: 32px 1fr 140px 64px; align-items: center; gap: 12px; padding: 9px 10px; border-radius: var(--r-md); color: var(--fg-2); transition: background-color .15s; cursor: pointer; }
.rowl:hover { background: var(--sub); }
.rowl .ic { width: 32px; height: 32px; border-radius: 10px; background: var(--sub); display: grid; place-items: center; color: var(--fg-2); }
.rowl b { color: var(--fg); font-weight: 500; }
.bar2 { height: 4px; border-radius: 4px; background: var(--line); position: relative; overflow: hidden; }
.bar2 i { position: absolute; inset: 0 auto 0 0; background: var(--fg); border-radius: 4px; }
.rowl .when { font-size: 12px; color: var(--fg-3); text-align: right; }
</style>
</head>
<body data-active="home">
<div class="app">
  <aside class="side"></aside>
  <main class="panel plain">
    <header class="bar"><div class="crumb"><b>新的課</b></div><span class="sp"></span></header>
    <section class="home">
      <div class="col">
        <svg class="art" width="200" height="118" viewBox="0 0 200 118" aria-hidden="true">
          <path class="f f2" d="M18 92 54 70 54 30 18 52z"/>
          <path class="f" d="M54 70 92 84 92 44 54 30z"/>
          <path class="f f2" d="M92 84 130 62 130 22 92 44z"/>
          <path class="f" d="M130 62 182 80 182 40 130 22z"/>
          <path class="ln2" d="M64 46l18 6M64 54l14 5M140 36l30 10M140 44l22 7M140 52l26 9"/>
          <circle class="acc" cx="111" cy="52" r="6"/>
          <path class="ln2" d="M26 60l20-12M26 68l14-8"/>
          <path d="M14 104h172" stroke="var(--line-2)" stroke-width="1.2" stroke-linecap="round"/>
        </svg>
        <h1>今天想弄懂什麼？</h1>
        <p class="lead">問一個問題，它會一步一步展開成一堂可以動手玩的課。</p>
        <div class="ask glow">
          <div class="box"><span class="ph">一個問題、一個好奇、一個卡住的地方…</span>
            <span class="ib" title="附加檔案"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path d="M21 12.5 12.5 21a5 5 0 0 1-7-7L14 5.5a3.3 3.3 0 0 1 4.7 4.7L10.2 18.7a1.7 1.7 0 0 1-2.4-2.4L15.5 8.6"/></svg></span>
            <button class="send" aria-label="送出"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M12 19V5M6 11l6-6 6 6"/></svg></button></div>
        </div>
        <div class="under"><span class="chip"><i></i>Sonnet 4.6</span><span>Enter 送出 · Shift + Enter 換行</span></div>
        <div class="try"><span class="lbl">試試</span><span class="sg">心算除法的小技巧</span><span class="sg">電燈泡為什麼會亮</span><span class="sg">看懂 Big-O</span><span class="sg">日文的て形怎麼變</span></div>
        <div class="cont">
          <h2>接著學</h2>
          <div class="rowl"><span class="ic" id="i1"></span><span><b>斜拋：角度和距離</b></span><span class="bar2"><i style="width:57%"></i></span><span class="when tnum">4 / 7 步</span></div>
          <div class="rowl"><span class="ic" id="i2"></span><span><b>莫內怎麼畫光</b></span><span class="bar2"><i style="width:40%"></i></span><span class="when tnum">2 / 5 步</span></div>
          <div class="rowl"><span class="ic" id="i3"></span><span><b>二分搜尋</b></span><span class="bar2"><i style="width:83%"></i></span><span class="when tnum">5 / 6 步</span></div>
        </div>
      </div>
    </section>
  </main>
</div>
<script src="shell.js"></script>
<script>const I=window.UNFOLD_ICONS;i1.innerHTML=I.phys;i2.innerHTML=I.art;i3.innerHTML=I.algo;</script>
</body>
</html>
